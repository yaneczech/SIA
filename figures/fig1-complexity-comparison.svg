<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where the cross-cutting interaction logic lives: before vs. after SIA</title>
  <desc id="desc">Two-panel comparison. Left panel labelled "Without SIA — N × M complexity" shows four emitters (ADAS, AI agent, cloud service, third-party app) connected through twenty direct paths to five renderers (HUD, cluster, IVI, voice, haptic), with a central callout listing the six concerns each path duplicates: trust verification, context evaluation, capability matching, accessibility handling, fallback chain, and audit logging. Right panel labelled "With SIA — N + M complexity" shows the same emitters and renderers, but communication passes through a single SIA mediation boundary containing Trust Policy, Translation Layer, and Coordination Runtime, plus Ontology and Context Policy as supporting components; the cross-cutting logic exists once and the renderers are thin stateless consumers.</desc>

  <style>
    .panel-title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .panel-subtitle { font-size: 11px; fill: #525252; font-style: italic; }

    .emitter { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .emitter-label { font-size: 11.5px; font-weight: 600; fill: #1a1a1a; }

    .renderer { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.2; }
    .renderer-label { font-size: 11.5px; font-weight: 600; fill: #1a1a1a; }
    .renderer-thin { fill: #ffffff; stroke: #d4d4d4; stroke-width: 1; }
    .renderer-thin-label { font-size: 11.5px; fill: #525252; }

    .web-line { fill: none; stroke: #b91c1c; stroke-width: 0.9; opacity: 0.35; }
    .clean-line-accent { fill: none; stroke: #0f766e; stroke-width: 1.4; }

    .sia-mid { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .sia-mid-accent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.4; }
    .sia-frame { fill: none; stroke: #0f766e; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .sia-label { font-size: 11.5px; font-weight: 700; fill: #0f766e; letter-spacing: 0.6px; }

    .callout { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.3; }
    .callout-title { font-size: 11.5px; font-weight: 700; fill: #b91c1c; letter-spacing: 0.4px; }
    .callout-item { font-size: 11px; fill: #1a1a1a; }
    .callout-count { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .callout-count-accent { font-size: 14px; font-weight: 700; fill: #0f766e; }

    .annot { font-size: 10px; fill: #525252; font-style: italic; }
    .figcap { font-size: 11px; fill: #525252; }

    .vs-divider { stroke: #d4d4d4; stroke-width: 1; stroke-dasharray: 3 4; }
    .vs-label { font-size: 16px; font-weight: 700; fill: #737373; }

    .badge-ext { font-size: 9.5px; font-weight: 700; fill: #737373; letter-spacing: 0.5px; }
  </style>

  <defs>
    <marker id="ah-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="620" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Where does the cross-cutting interaction logic live?</text>

  <!-- VS divider -->
  <line x1="620" y1="60" x2="620" y2="690" class="vs-divider"/>
  <circle cx="620" cy="375" r="22" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.2"/>
  <text x="620" y="381" text-anchor="middle" class="vs-label">vs.</text>

  <!-- ====================================== -->
  <!-- LEFT PANEL: WITHOUT SIA -->
  <!-- ====================================== -->

  <text x="315" y="68" text-anchor="middle" class="panel-title">Without SIA</text>
  <text x="315" y="86" text-anchor="middle" class="panel-subtitle">N × M complexity — every path carries its own copy of cross-cutting logic</text>

  <!-- External badges -->
  <text x="35" y="135" class="badge-ext">EMITTERS</text>
  <text x="35" y="605" class="badge-ext">RENDERERS</text>

  <!-- 4 Emitters at top -->
  <rect x="100" y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="152" y="130" text-anchor="middle" class="emitter-label">ADAS</text>
  <text x="152" y="146" text-anchor="middle" class="annot">collision · lane</text>

  <rect x="220" y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="272" y="130" text-anchor="middle" class="emitter-label">AI Agent</text>
  <text x="272" y="146" text-anchor="middle" class="annot">local · cloud LLM</text>

  <rect x="340" y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="392" y="130" text-anchor="middle" class="emitter-label">Cloud Service</text>
  <text x="392" y="146" text-anchor="middle" class="annot">telematics · OTA</text>

  <rect x="460" y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="512" y="130" text-anchor="middle" class="emitter-label">3rd-party app</text>
  <text x="512" y="146" text-anchor="middle" class="annot">media · maps</text>

  <!-- 20 chaotic lines (4 × 5) -->
  <g>
    <line x1="152" y1="154" x2="85"  y2="580" class="web-line"/>
    <line x1="152" y1="154" x2="195" y2="580" class="web-line"/>
    <line x1="152" y1="154" x2="305" y2="580" class="web-line"/>
    <line x1="152" y1="154" x2="415" y2="580" class="web-line"/>
    <line x1="152" y1="154" x2="525" y2="580" class="web-line"/>
    <line x1="272" y1="154" x2="85"  y2="580" class="web-line"/>
    <line x1="272" y1="154" x2="195" y2="580" class="web-line"/>
    <line x1="272" y1="154" x2="305" y2="580" class="web-line"/>
    <line x1="272" y1="154" x2="415" y2="580" class="web-line"/>
    <line x1="272" y1="154" x2="525" y2="580" class="web-line"/>
    <line x1="392" y1="154" x2="85"  y2="580" class="web-line"/>
    <line x1="392" y1="154" x2="195" y2="580" class="web-line"/>
    <line x1="392" y1="154" x2="305" y2="580" class="web-line"/>
    <line x1="392" y1="154" x2="415" y2="580" class="web-line"/>
    <line x1="392" y1="154" x2="525" y2="580" class="web-line"/>
    <line x1="512" y1="154" x2="85"  y2="580" class="web-line"/>
    <line x1="512" y1="154" x2="195" y2="580" class="web-line"/>
    <line x1="512" y1="154" x2="305" y2="580" class="web-line"/>
    <line x1="512" y1="154" x2="415" y2="580" class="web-line"/>
    <line x1="512" y1="154" x2="525" y2="580" class="web-line"/>
  </g>

  <!-- Central callout overlaying the chaos -->
  <rect x="75" y="230" width="465" height="305" class="callout" rx="6"/>
  <text x="307" y="258" text-anchor="middle" class="callout-title">EVERY ONE OF THE 20 PATHS IMPLEMENTS — INDEPENDENTLY</text>

  <text x="100" y="288" class="callout-item">•  Trust verification — origin · freshness · replay</text>
  <text x="100" y="310" class="callout-item">•  Context evaluation — autonomy · driver state · jurisdiction</text>
  <text x="100" y="332" class="callout-item">•  Capability matching — does this renderer support this alert?</text>
  <text x="100" y="354" class="callout-item">•  Accessibility handling — low vision · hearing · motor</text>
  <text x="100" y="376" class="callout-item">•  Fallback chain — what if HUD is offline?</text>
  <text x="100" y="398" class="callout-item">•  Audit · logging · version compatibility</text>

  <line x1="95" y1="418" x2="520" y2="418" stroke="#b91c1c" stroke-width="0.8" opacity="0.5"/>

  <text x="307" y="445" text-anchor="middle" class="callout-count">= 20 implementations of the same six concerns</text>
  <text x="307" y="468" text-anchor="middle" class="annot">divergent behaviour · no shared audit trail</text>
  <text x="307" y="486" text-anchor="middle" class="annot">every new emitter or renderer multiplies the matrix</text>
  <text x="307" y="520" text-anchor="middle" class="callout-count">∼ N × M growth</text>

  <!-- 5 Renderers at bottom -->
  <rect x="35"  y="580" width="100" height="40" class="renderer" rx="3"/>
  <text x="85"  y="604" text-anchor="middle" class="renderer-label">HUD</text>

  <rect x="145" y="580" width="100" height="40" class="renderer" rx="3"/>
  <text x="195" y="604" text-anchor="middle" class="renderer-label">Cluster</text>

  <rect x="255" y="580" width="100" height="40" class="renderer" rx="3"/>
  <text x="305" y="604" text-anchor="middle" class="renderer-label">IVI</text>

  <rect x="365" y="580" width="100" height="40" class="renderer" rx="3"/>
  <text x="415" y="604" text-anchor="middle" class="renderer-label">Voice</text>

  <rect x="475" y="580" width="100" height="40" class="renderer" rx="3"/>
  <text x="525" y="604" text-anchor="middle" class="renderer-label">Haptic</text>

  <text x="307" y="650" text-anchor="middle" class="annot">— each renderer re-implements policy locally for every emitter it serves —</text>

  <!-- ====================================== -->
  <!-- RIGHT PANEL: WITH SIA -->
  <!-- ====================================== -->

  <text x="925" y="68" text-anchor="middle" class="panel-title">With SIA</text>
  <text x="925" y="86" text-anchor="middle" class="panel-subtitle">N + M complexity — cross-cutting logic lives once; renderers are thin consumers</text>

  <!-- External badges -->
  <text x="660" y="135" class="badge-ext">EMITTERS</text>
  <text x="660" y="605" class="badge-ext">RENDERERS</text>

  <!-- 4 Emitters -->
  <rect x="715"  y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="767" y="130" text-anchor="middle" class="emitter-label">ADAS</text>
  <text x="767" y="146" text-anchor="middle" class="annot">collision · lane</text>

  <rect x="835"  y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="887" y="130" text-anchor="middle" class="emitter-label">AI Agent</text>
  <text x="887" y="146" text-anchor="middle" class="annot">local · cloud LLM</text>

  <rect x="955"  y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="1007" y="130" text-anchor="middle" class="emitter-label">Cloud Service</text>
  <text x="1007" y="146" text-anchor="middle" class="annot">telematics · OTA</text>

  <rect x="1075" y="110" width="105" height="44" class="emitter" rx="3"/>
  <text x="1127" y="130" text-anchor="middle" class="emitter-label">3rd-party app</text>
  <text x="1127" y="146" text-anchor="middle" class="annot">media · maps</text>

  <!-- SIA frame -->
  <rect x="660" y="190" width="530" height="330" class="sia-frame" rx="6"/>
  <text x="675" y="210" class="sia-label">SIA — single mediation boundary</text>

  <!-- Trust Policy -->
  <rect x="680" y="230" width="490" height="48" class="sia-mid" rx="3"/>
  <text x="925" y="251" text-anchor="middle" class="emitter-label">Trust Policy</text>
  <text x="925" y="267" text-anchor="middle" class="annot">verify origin · actor_class · freshness · replay — fail-closed</text>

  <!-- Translation Layer -->
  <rect x="680" y="290" width="490" height="48" class="sia-mid" rx="3"/>
  <text x="925" y="311" text-anchor="middle" class="emitter-label">Translation Layer</text>
  <text x="925" y="327" text-anchor="middle" class="annot">capability matching · accessibility · context-effective cost · fallback selection</text>

  <!-- Coordination Runtime -->
  <rect x="680" y="350" width="490" height="48" class="sia-mid" rx="3"/>
  <text x="925" y="371" text-anchor="middle" class="emitter-label">Interaction Coordination Runtime</text>
  <text x="925" y="387" text-anchor="middle" class="annot">focus · ack timers · cross-renderer consistency · audit log</text>

  <!-- Ontology -->
  <rect x="680" y="415" width="235" height="78" class="sia-mid-accent" rx="3"/>
  <text x="797" y="434" text-anchor="middle" class="sia-label">Ontology + Schema Profile</text>
  <text x="797" y="453" text-anchor="middle" class="annot">single source of meaning</text>
  <text x="797" y="470" text-anchor="middle" class="annot">— consulted by Trust + Translation</text>
  <text x="797" y="486" text-anchor="middle" class="annot">— versioned · auditable —</text>

  <!-- Context Policy -->
  <rect x="935" y="415" width="235" height="78" class="sia-mid" rx="3"/>
  <text x="1052" y="434" text-anchor="middle" class="emitter-label">Context Policy</text>
  <text x="1052" y="453" text-anchor="middle" class="annot">SAE · road · vehicle state</text>
  <text x="1052" y="470" text-anchor="middle" class="annot">— modulates Translation + Runtime</text>
  <text x="1052" y="486" text-anchor="middle" class="annot">— published modifier rules —</text>

  <!-- Clean lines emitters → Trust -->
  <line x1="767"  y1="154" x2="767"  y2="227" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="887"  y1="154" x2="887"  y2="227" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="1007" y1="154" x2="1007" y2="227" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="1127" y1="154" x2="1127" y2="227" class="clean-line-accent" marker-end="url(#ah-accent)"/>

  <!-- Renderers at bottom -->
  <rect x="695"  y="580" width="100" height="40" class="renderer-thin" rx="3"/>
  <text x="745"  y="604" text-anchor="middle" class="renderer-thin-label">HUD</text>

  <rect x="805"  y="580" width="100" height="40" class="renderer-thin" rx="3"/>
  <text x="855"  y="604" text-anchor="middle" class="renderer-thin-label">Cluster</text>

  <rect x="915"  y="580" width="100" height="40" class="renderer-thin" rx="3"/>
  <text x="965"  y="604" text-anchor="middle" class="renderer-thin-label">IVI</text>

  <rect x="1025" y="580" width="100" height="40" class="renderer-thin" rx="3"/>
  <text x="1075" y="604" text-anchor="middle" class="renderer-thin-label">Voice</text>

  <rect x="1135" y="580" width="100" height="40" class="renderer-thin" rx="3"/>
  <text x="1185" y="604" text-anchor="middle" class="renderer-thin-label">Haptic</text>

  <!-- Lines Runtime/SIA → renderers (from bottom of SIA frame) -->
  <line x1="745"  y1="523" x2="745"  y2="578" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="855"  y1="523" x2="855"  y2="578" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="965"  y1="523" x2="965"  y2="578" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="1075" y1="523" x2="1075" y2="578" class="clean-line-accent" marker-end="url(#ah-accent)"/>
  <line x1="1185" y1="523" x2="1185" y2="578" class="clean-line-accent" marker-end="url(#ah-accent)"/>

  <text x="925" y="650" text-anchor="middle" class="annot">— thin stateless consumers: declare capabilities once, execute modality decisions —</text>

  <!-- N+M growth callout -->
  <text x="925" y="685" text-anchor="middle" class="callout-count-accent">∼ N + M growth · 9 integrations total</text>

  <!-- Caption -->
  <text x="620" y="725" text-anchor="middle" class="figcap">Figure 4. Same emitters, same renderers — what changes is where the cross-cutting logic lives. SIA does not add a layer of complexity;</text>
  <text x="620" y="743" text-anchor="middle" class="figcap">it consolidates an existing N × M matrix of duplicated logic into a single mediation boundary. Adding a new emitter or renderer is linear, not multiplicative.</text>
</svg>
