<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Position of Semantic Interaction Architecture in the SDV stack</title>
  <desc id="desc">Layered diagram placing the proposed Semantic Interaction Architecture between HMI renderers and existing SDV services, data, middleware, and hardware.</desc>
  <style>
    .layer { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .layer-sub { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.2; }
    .proposed { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
    .layer-label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .layer-label-accent { font-size: 13px; font-weight: 700; fill: #0f766e; }
    .component { font-size: 11px; fill: #404040; }
    .component-accent { font-size: 11px; fill: #0f766e; }
    .side-note { font-size: 10px; fill: #525252; font-style: italic; }
    .scope { font-size: 10px; font-weight: 600; fill: #525252; letter-spacing: 0.5px; }
    .figcap { font-size: 11px; fill: #525252; }
    .role-divider { stroke: #d4d4d4; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- left-side scope brackets -->
  <text x="40" y="60" class="scope">OCCUPANT</text>
  <text x="40" y="155" class="scope">PHYSICAL HMI</text>
  <text x="40" y="240" class="scope">PROPOSED LAYER</text>
  <text x="40" y="335" class="scope">SDV STACK</text>
  <text x="40" y="475" class="scope">HARDWARE</text>

  <!-- Occupant -->
  <rect x="180" y="40" width="540" height="42" class="layer" rx="3"/>
  <text x="450" y="58" text-anchor="middle" class="layer-label">Occupant</text>
  <text x="450" y="74" text-anchor="middle" class="component">Driver · Front passenger · Rear passenger</text>

  <!-- HMI Surfaces -->
  <rect x="180" y="100" width="540" height="80" class="layer-sub" rx="3"/>
  <text x="450" y="120" text-anchor="middle" class="layer-label">Physical HMI surfaces and Input Devices</text>
  <text x="220" y="145" class="component">HUD</text>
  <text x="280" y="145" class="component">Cluster</text>
  <text x="345" y="145" class="component">IVI touchscreen</text>
  <text x="445" y="145" class="component">Voice</text>
  <text x="495" y="145" class="component">Haptic</text>
  <text x="560" y="145" class="component">AR overlay</text>
  <text x="640" y="145" class="component">Steering wheel</text>
  <text x="220" y="165" class="component">Jog wheel</text>
  <text x="290" y="165" class="component">Buttons</text>
  <text x="355" y="165" class="component">Gesture</text>
  <text x="425" y="165" class="component">Eye tracking</text>
  <text x="525" y="165" class="component">Pedals · Stalks</text>

  <!-- Proposed: Semantic Interaction Architecture -->
  <rect x="180" y="200" width="540" height="80" class="proposed" rx="3"/>
  <text x="450" y="222" text-anchor="middle" class="layer-label-accent">Semantic Interaction Architecture</text>
  <text x="210" y="248" class="component-accent">Ontology</text>
  <text x="278" y="248" class="component-accent">Translation</text>
  <text x="355" y="248" class="component-accent">Runtime</text>
  <text x="420" y="248" class="component-accent">Renderer</text>
  <text x="490" y="248" class="component-accent">Context</text>
  <text x="555" y="248" class="component-accent">Trust</text>
  <text x="450" y="268" text-anchor="middle" class="side-note">— four functional layers + two cross-cutting policies (Trust, Context) —</text>

  <!-- SDV Stack: services -->
  <rect x="180" y="300" width="540" height="48" class="layer-sub" rx="3"/>
  <text x="450" y="319" text-anchor="middle" class="layer-label">Services and Orchestration</text>
  <text x="225" y="338" class="component">Kuksa Databroker</text>
  <text x="345" y="338" class="component">uProtocol · Zenoh</text>
  <text x="475" y="338" class="component">Chariott</text>
  <text x="545" y="338" class="component">Ankaios · Symphony</text>

  <!-- SDV: data -->
  <rect x="180" y="358" width="540" height="32" class="layer-sub" rx="3"/>
  <text x="450" y="378" text-anchor="middle" class="layer-label">Data Model — COVESA VSS</text>

  <!-- Middleware -->
  <rect x="180" y="400" width="540" height="32" class="layer-sub" rx="3"/>
  <text x="450" y="420" text-anchor="middle" class="layer-label">Middleware — AUTOSAR Classic · Adaptive · S-CORE</text>

  <!-- Hardware -->
  <rect x="180" y="442" width="540" height="48" class="layer" rx="3"/>
  <text x="450" y="461" text-anchor="middle" class="layer-label">Hardware</text>
  <text x="225" y="480" class="component">HPC</text>
  <text x="280" y="480" class="component">ECUs</text>
  <text x="335" y="480" class="component">Sensors</text>
  <text x="395" y="480" class="component">Actuators</text>
  <text x="465" y="480" class="component">CAN · Ethernet · SOME/IP</text>

  <!-- caption -->
  <text x="380" y="520" text-anchor="middle" class="figcap">Figure 1. Position of the proposed Semantic Interaction Architecture relative to existing SDV layers.</text>
</svg>
