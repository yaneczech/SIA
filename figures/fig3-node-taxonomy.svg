<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .root { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.8; }
    .type { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.2; }
    .subtype { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .leaf { fill: #ffffff; stroke: #d4d4d4; stroke-width: 1; }
    .label-root { font-size: 13px; font-weight: 700; fill: #0f766e; }
    .label-type { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label-sub { font-size: 12px; font-weight: 500; fill: #1a1a1a; }
    .label-leaf { font-size: 10.5px; fill: #404040; }
    .note { font-size: 10px; fill: #525252; font-style: italic; }
    .branch { fill: none; stroke: #737373; stroke-width: 1; }
    .figcap { font-size: 11px; fill: #525252; }
    .pill-text { font-size: 9.5px; fill: #0f766e; font-weight: 600; }
  </style>

  <!-- Root -->
  <rect x="320" y="20" width="120" height="36" class="root" rx="3"/>
  <text x="380" y="42" text-anchor="middle" class="label-root">Interaction</text>

  <!-- Branches: Action, Event, State, Task -->
  <line x1="380" y1="56" x2="380" y2="76" class="branch"/>
  <line x1="120" y1="76" x2="640" y2="76" class="branch"/>
  <line x1="120" y1="76" x2="120" y2="92" class="branch"/>
  <line x1="295" y1="76" x2="295" y2="92" class="branch"/>
  <line x1="465" y1="76" x2="465" y2="92" class="branch"/>
  <line x1="640" y1="76" x2="640" y2="92" class="branch"/>

  <!-- Type boxes -->
  <rect x="60" y="92" width="120" height="38" class="type" rx="3"/>
  <text x="120" y="111" text-anchor="middle" class="label-type">Action</text>
  <text x="120" y="125" text-anchor="middle" class="note">user → system</text>

  <rect x="235" y="92" width="120" height="38" class="type" rx="3"/>
  <text x="295" y="111" text-anchor="middle" class="label-type">Event</text>
  <text x="295" y="125" text-anchor="middle" class="note">system → user</text>

  <rect x="405" y="92" width="120" height="38" class="type" rx="3"/>
  <text x="465" y="111" text-anchor="middle" class="label-type">State</text>
  <text x="465" y="125" text-anchor="middle" class="note">runtime-internal</text>

  <rect x="580" y="92" width="120" height="38" class="type" rx="3"/>
  <text x="640" y="111" text-anchor="middle" class="label-type">Task</text>
  <text x="640" y="125" text-anchor="middle" class="note">composed flow</text>

  <!-- Action leaves -->
  <line x1="120" y1="130" x2="120" y2="150" class="branch"/>
  <rect x="40" y="150" width="160" height="22" class="leaf" rx="2"/>
  <text x="120" y="165" text-anchor="middle" class="label-leaf">Navigate.Back</text>
  <line x1="120" y1="172" x2="120" y2="180" class="branch"/>
  <rect x="40" y="180" width="160" height="22" class="leaf" rx="2"/>
  <text x="120" y="195" text-anchor="middle" class="label-leaf">Media.Volume.Increase</text>
  <line x1="120" y1="202" x2="120" y2="210" class="branch"/>
  <rect x="40" y="210" width="160" height="22" class="leaf" rx="2"/>
  <text x="120" y="225" text-anchor="middle" class="label-leaf">Map.Zoom</text>
  <line x1="120" y1="232" x2="120" y2="240" class="branch"/>
  <rect x="40" y="240" width="160" height="22" class="leaf" rx="2"/>
  <text x="120" y="255" text-anchor="middle" class="label-leaf">Focus.Next</text>

  <!-- Event splits into Alert and Notification -->
  <line x1="295" y1="130" x2="295" y2="150" class="branch"/>
  <line x1="240" y1="150" x2="350" y2="150" class="branch"/>
  <line x1="240" y1="150" x2="240" y2="166" class="branch"/>
  <line x1="350" y1="150" x2="350" y2="166" class="branch"/>

  <rect x="180" y="166" width="120" height="30" class="subtype" rx="3"/>
  <text x="240" y="185" text-anchor="middle" class="label-sub">Alert</text>

  <rect x="290" y="166" width="120" height="30" class="subtype" rx="3"/>
  <text x="350" y="185" text-anchor="middle" class="label-sub">Notification</text>

  <!-- Alert leaves -->
  <line x1="240" y1="196" x2="240" y2="210" class="branch"/>
  <rect x="160" y="210" width="160" height="22" class="leaf" rx="2"/>
  <text x="240" y="225" text-anchor="middle" class="label-leaf">Alert.Collision.Warning</text>
  <line x1="240" y1="232" x2="240" y2="240" class="branch"/>
  <rect x="160" y="240" width="160" height="22" class="leaf" rx="2"/>
  <text x="240" y="255" text-anchor="middle" class="label-leaf">Alert.Lane.Departure</text>

  <!-- Notification leaves -->
  <line x1="350" y1="196" x2="350" y2="210" class="branch"/>
  <rect x="270" y="210" width="160" height="22" class="leaf" rx="2"/>
  <text x="350" y="225" text-anchor="middle" class="label-leaf">Notification.Message.Incoming</text>
  <line x1="350" y1="232" x2="350" y2="240" class="branch"/>
  <rect x="270" y="240" width="160" height="22" class="leaf" rx="2"/>
  <text x="350" y="255" text-anchor="middle" class="label-leaf">Notification.Media.TrackChange</text>

  <!-- State leaves -->
  <line x1="465" y1="130" x2="465" y2="150" class="branch"/>
  <rect x="385" y="150" width="160" height="22" class="leaf" rx="2"/>
  <text x="465" y="165" text-anchor="middle" class="label-leaf">State.Focus.Domain</text>
  <line x1="465" y1="172" x2="465" y2="180" class="branch"/>
  <rect x="385" y="180" width="160" height="22" class="leaf" rx="2"/>
  <text x="465" y="195" text-anchor="middle" class="label-leaf">State.Mode.AutonomyEngaged</text>

  <!-- Task leaves -->
  <line x1="640" y1="130" x2="640" y2="150" class="branch"/>
  <rect x="560" y="150" width="160" height="22" class="leaf" rx="2"/>
  <text x="640" y="165" text-anchor="middle" class="label-leaf">Task.Media.Browse</text>
  <line x1="640" y1="172" x2="640" y2="180" class="branch"/>
  <rect x="560" y="180" width="160" height="22" class="leaf" rx="2"/>
  <text x="640" y="195" text-anchor="middle" class="label-leaf">Task.Route.PlanWithStops</text>

  <!-- Metadata pills (showing what each type carries) -->
  <text x="120" y="295" text-anchor="middle" class="pill-text">attention_metrics</text>
  <text x="120" y="308" text-anchor="middle" class="pill-text">temporal_type</text>
  <text x="120" y="321" text-anchor="middle" class="pill-text">recommended_modality</text>

  <text x="240" y="295" text-anchor="middle" class="pill-text">trust_requirements</text>
  <text x="240" y="308" text-anchor="middle" class="pill-text">priority</text>
  <text x="240" y="321" text-anchor="middle" class="pill-text">requires_ack</text>
  <text x="240" y="334" text-anchor="middle" class="pill-text">freshness_max_age</text>

  <text x="350" y="295" text-anchor="middle" class="pill-text">suppression_class</text>
  <text x="350" y="308" text-anchor="middle" class="pill-text">priority</text>
  <text x="350" y="321" text-anchor="middle" class="pill-text">merges_with</text>

  <text x="465" y="295" text-anchor="middle" class="pill-text">scope</text>
  <text x="465" y="308" text-anchor="middle" class="pill-text">target_role</text>
  <text x="465" y="321" text-anchor="middle" class="pill-text">consistency_class</text>

  <text x="640" y="295" text-anchor="middle" class="pill-text">step_count</text>
  <text x="640" y="308" text-anchor="middle" class="pill-text">interruptible_at</text>
  <text x="640" y="321" text-anchor="middle" class="pill-text">resumable_across_contexts</text>

  <!-- Horizontal rule separating metadata -->
  <line x1="40" y1="278" x2="720" y2="278" stroke="#e5e5e5" stroke-width="1"/>
  <text x="380" y="272" text-anchor="middle" class="note">— characteristic metadata fields per type —</text>

  <!-- Note about inheritance -->
  <text x="380" y="375" text-anchor="middle" class="note">Naming follows reverse-DNS hierarchy. Inheritance is supported:</text>
  <text x="380" y="389" text-anchor="middle" class="note">subclasses may strengthen but not weaken metadata contracts.</text>
  <text x="380" y="403" text-anchor="middle" class="note">Every node carries since_version; deprecated nodes carry replaced_by.</text>

  <!-- caption -->
  <text x="380" y="440" text-anchor="middle" class="figcap">Figure 3. Node taxonomy. Four primary types with distinct metadata contracts; Event splits into Alert and Notification.</text>
</svg>
