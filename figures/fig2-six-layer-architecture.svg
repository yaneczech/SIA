<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Semantic mediation architecture</title>
  <desc id="desc">Architecture diagram showing Renderer, Interaction Coordination Runtime, Translation, Ontology Language and Schema Profile, Context Policy, and Trust and Provenance Policy responsibilities.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .box-light { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.2; }
    .span-box { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label-accent { font-size: 13px; font-weight: 700; fill: #0f766e; }
    .desc { font-size: 11px; fill: #404040; }
    .desc-accent { font-size: 11px; fill: #0f766e; }
    .annot { font-size: 10px; fill: #525252; font-style: italic; }
    .arrow { fill: none; stroke: #1a1a1a; stroke-width: 1.2; }
    .arrow-accent { fill: none; stroke: #0f766e; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .figcap { font-size: 11px; fill: #525252; }
    .external { font-size: 10px; fill: #737373; font-style: italic; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- External: Occupant top -->
  <text x="380" y="32" text-anchor="middle" class="external">Occupant input · output</text>

  <!-- Renderer layer at top -->
  <rect x="160" y="48" width="440" height="50" class="box" rx="3"/>
  <text x="380" y="69" text-anchor="middle" class="label">Renderer Layer</text>
  <text x="380" y="86" text-anchor="middle" class="desc">HUD · Cluster · IVI · Voice · Haptic · AR — consumers of the semantic stream</text>

  <!-- Runtime -->
  <rect x="160" y="120" width="440" height="50" class="box-light" rx="3"/>
  <text x="380" y="141" text-anchor="middle" class="label">Interaction Coordination Runtime</text>
  <text x="380" y="158" text-anchor="middle" class="desc">Focus · task-flow state · acknowledgement · cross-renderer consistency</text>

  <!-- Translation -->
  <rect x="160" y="192" width="440" height="50" class="box-light" rx="3"/>
  <text x="380" y="213" text-anchor="middle" class="label">Translation Layer</text>
  <text x="380" y="230" text-anchor="middle" class="desc">node × capabilities × context → concrete modality decision</text>

  <!-- Ontology at the heart -->
  <rect x="160" y="264" width="440" height="58" class="span-box" rx="3"/>
  <text x="380" y="287" text-anchor="middle" class="label-accent">Ontology Language + Schema Profile</text>
  <text x="380" y="304" text-anchor="middle" class="desc-accent">Typed primitives · metadata contracts · compatibility</text>
  <text x="380" y="318" text-anchor="middle" class="annot">— long-term language of meaning —</text>

  <!-- Side: Context Policy (right) -->
  <rect x="620" y="120" width="120" height="122" class="box-light" rx="3"/>
  <text x="680" y="143" text-anchor="middle" class="label">Context</text>
  <text x="680" y="158" text-anchor="middle" class="label">Policy</text>
  <text x="680" y="178" text-anchor="middle" class="desc">SAE level</text>
  <text x="680" y="193" text-anchor="middle" class="desc">Road type</text>
  <text x="680" y="208" text-anchor="middle" class="desc">Driver state</text>
  <text x="680" y="223" text-anchor="middle" class="desc">Market</text>
  <text x="680" y="238" text-anchor="middle" class="desc">jurisdiction</text>

  <!-- Side: Trust and Provenance Policy (left) -->
  <rect x="20" y="48" width="120" height="274" class="box-light" rx="3"/>
  <text x="80" y="72" text-anchor="middle" class="label">Trust</text>
  <text x="80" y="88" text-anchor="middle" class="label">Policy</text>
  <text x="80" y="115" text-anchor="middle" class="desc">cross-cutting</text>
  <text x="80" y="130" text-anchor="middle" class="desc">verification</text>
  <text x="80" y="160" text-anchor="middle" class="desc">requirement</text>
  <text x="80" y="175" text-anchor="middle" class="desc">vs.</text>
  <text x="80" y="190" text-anchor="middle" class="desc">attestation</text>
  <text x="80" y="220" text-anchor="middle" class="desc">actor_class</text>
  <text x="80" y="235" text-anchor="middle" class="desc">policy</text>
  <text x="80" y="265" text-anchor="middle" class="desc">freshness</text>
  <text x="80" y="280" text-anchor="middle" class="desc">replay</text>
  <text x="80" y="295" text-anchor="middle" class="desc">provenance</text>

  <!-- External: SDV transport at bottom -->
  <rect x="160" y="358" width="440" height="42" class="box" rx="3"/>
  <text x="380" y="378" text-anchor="middle" class="label">SDV transport — Kuksa · uProtocol · service registry</text>
  <text x="380" y="392" text-anchor="middle" class="external">— consumed, not part of this layer —</text>

  <!-- Vertical connectors: layering relationship, not flow direction.
       Node flow at runtime is upward (Trust → Translation → Runtime → Renderer → Occupant);
       Ontology provides the contract used by every layer above. -->
  <line x1="380" y1="170" x2="380" y2="190" class="arrow" stroke-dasharray="2 3"/>
  <line x1="380" y1="242" x2="380" y2="262" class="arrow" stroke-dasharray="2 3"/>
  <line x1="380" y1="98" x2="380" y2="118" class="arrow" stroke-dasharray="2 3"/>
  <line x1="380" y1="322" x2="380" y2="356" class="arrow" stroke-dasharray="2 3"/>

  <!-- Context modulates Translation -->
  <line x1="618" y1="217" x2="602" y2="217" class="arrow-accent" marker-end="url(#arrowhead-accent)"/>
  <text x="610" y="207" text-anchor="end" class="annot">modulates</text>

  <!-- Trust validates -->
  <line x1="142" y1="217" x2="158" y2="217" class="arrow-accent" marker-end="url(#arrowhead-accent)"/>
  <text x="150" y="207" text-anchor="start" class="annot">validates</text>

  <!-- caption -->
  <text x="380" y="450" text-anchor="middle" class="figcap">Figure 2. Mediation architecture (layered view). Dashed vertical connectors show layering only;</text>
  <text x="380" y="465" text-anchor="middle" class="figcap">node flow at runtime is upward (Trust → Translation → Runtime → Renderer). Trust and Context are cross-cutting policy functions.</text>
</svg>
