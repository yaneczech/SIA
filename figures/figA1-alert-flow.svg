<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Alert.Collision.Warning trust and translation flow</title>
  <desc id="desc">Sequence diagram showing ADAS emission, trust and provenance verification, Translation, Runtime acknowledgement handling, and renderer dispatch for a collision warning alert.</desc>
  <style>
    .lane-label { font-size: 11px; font-weight: 600; fill: #1a1a1a; }
    .lane-sub { font-size: 9.5px; fill: #525252; font-style: italic; }
    .lifeline { stroke: #d4d4d4; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { fill: none; stroke: #1a1a1a; stroke-width: 1.3; }
    .arrow-accent { fill: none; stroke: #0f766e; stroke-width: 1.3; }
    .arrow-reject { fill: none; stroke: #b91c1c; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .msg-label { font-size: 10.5px; fill: #1a1a1a; }
    .msg-accent { font-size: 10.5px; fill: #0f766e; font-weight: 600; }
    .msg-reject { font-size: 10.5px; fill: #b91c1c; font-style: italic; }
    .action-box { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1; }
    .action-box-accent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.3; }
    .action-label { font-size: 10px; fill: #1a1a1a; }
    .action-label-accent { font-size: 10px; fill: #0f766e; font-weight: 600; }
    .figcap { font-size: 11px; fill: #525252; }
    .legend { font-size: 10px; fill: #525252; }
  </style>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ah-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
    <marker id="ah-reject" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Lane headers -->
  <rect x="20" y="20" width="110" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
  <text x="75" y="38" text-anchor="middle" class="lane-label">ADAS</text>
  <text x="75" y="50" text-anchor="middle" class="lane-sub">emitter</text>

  <rect x="150" y="20" width="110" height="34" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3" rx="3"/>
  <text x="205" y="38" text-anchor="middle" class="lane-label">Trust Policy</text>
  <text x="205" y="50" text-anchor="middle" class="lane-sub">verifier</text>

  <rect x="280" y="20" width="110" height="34" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
  <text x="335" y="38" text-anchor="middle" class="lane-label">Translation</text>
  <text x="335" y="50" text-anchor="middle" class="lane-sub">+ Context</text>

  <rect x="410" y="20" width="110" height="34" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
  <text x="465" y="38" text-anchor="middle" class="lane-label">Runtime</text>
  <text x="465" y="50" text-anchor="middle" class="lane-sub">state · focus · ack</text>

  <rect x="540" y="20" width="200" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" rx="3"/>
  <text x="640" y="38" text-anchor="middle" class="lane-label">Renderers</text>
  <text x="640" y="50" text-anchor="middle" class="lane-sub">HUD · Cluster · Voice · Haptic</text>

  <!-- Lifelines -->
  <line x1="75"  y1="58" x2="75"  y2="490" class="lifeline"/>
  <line x1="205" y1="58" x2="205" y2="490" class="lifeline"/>
  <line x1="335" y1="58" x2="335" y2="490" class="lifeline"/>
  <line x1="465" y1="58" x2="465" y2="490" class="lifeline"/>
  <line x1="640" y1="58" x2="640" y2="490" class="lifeline"/>

  <!-- 1. emit instance + attestation -->
  <line x1="75" y1="80" x2="200" y2="80" class="arrow" marker-end="url(#ah)"/>
  <text x="135" y="74" text-anchor="middle" class="msg-label">emit instance + attestation</text>

  <!-- Trust verifier action box -->
  <rect x="170" y="92" width="70" height="56" class="action-box-accent" rx="2"/>
  <text x="205" y="108" text-anchor="middle" class="action-label-accent">verify</text>
  <text x="205" y="121" text-anchor="middle" class="action-label">signature</text>
  <text x="205" y="133" text-anchor="middle" class="action-label">actor_class</text>
  <text x="205" y="145" text-anchor="middle" class="action-label">freshness</text>

  <!-- 2a. (reject path - dashed line back to ADAS for rejected variant) -->
  <line x1="205" y1="170" x2="80" y2="170" class="arrow-reject" marker-end="url(#ah-reject)"/>
  <text x="142" y="164" text-anchor="middle" class="msg-reject">reject + log SecurityEvent (adversarial cases)</text>

  <!-- 2b. accept → translation -->
  <line x1="205" y1="195" x2="330" y2="195" class="arrow-accent" marker-end="url(#ah-accent)"/>
  <text x="267" y="189" text-anchor="middle" class="msg-accent">verified node propagates</text>

  <!-- Translation action box -->
  <rect x="295" y="208" width="80" height="68" class="action-box" rx="2"/>
  <text x="335" y="222" text-anchor="middle" class="action-label">resolve context</text>
  <text x="335" y="235" text-anchor="middle" class="action-label">× capabilities</text>
  <text x="335" y="248" text-anchor="middle" class="action-label">× a11y profile</text>
  <text x="335" y="261" text-anchor="middle" class="action-label">→ modality set</text>
  <text x="335" y="274" text-anchor="middle" class="action-label">→ effective_cost</text>

  <!-- 3. allocate state slot -->
  <line x1="335" y1="295" x2="460" y2="295" class="arrow" marker-end="url(#ah)"/>
  <text x="397" y="289" text-anchor="middle" class="msg-label">allocate focus slot · arm ack timer</text>

  <!-- 4. dispatch to multiple renderers (multicast) -->
  <line x1="465" y1="320" x2="635" y2="320" class="arrow" marker-end="url(#ah)"/>
  <text x="550" y="314" text-anchor="middle" class="msg-label">dispatch (multicast)</text>

  <!-- Renderer action boxes (stacked, parallel) -->
  <rect x="540" y="332" width="200" height="48" class="action-box" rx="2"/>
  <text x="640" y="348" text-anchor="middle" class="action-label">HUD: bearing icon (600 ms glance)</text>
  <text x="640" y="362" text-anchor="middle" class="action-label">Cluster: redundant visual</text>
  <text x="640" y="376" text-anchor="middle" class="action-label">Voice: short prompt · Haptic: pulse</text>

  <!-- 5. user acknowledges → renderer → runtime -->
  <line x1="640" y1="400" x2="470" y2="400" class="arrow" marker-end="url(#ah)"/>
  <text x="555" y="394" text-anchor="middle" class="msg-label">ack (explicit input | gaze | timeout)</text>

  <!-- 6. runtime closes interaction → notify translation/trust -->
  <line x1="465" y1="425" x2="210" y2="425" class="arrow" marker-end="url(#ah)"/>
  <text x="337" y="419" text-anchor="middle" class="msg-label">close interaction · log outcome</text>

  <!-- 7. degradation note (annotation) -->
  <text x="380" y="460" text-anchor="middle" class="legend">If preferred renderer unavailable, Translation escalates via fallback_chain. If ack times out, Runtime escalates priority.</text>

  <!-- caption -->
  <text x="380" y="520" text-anchor="middle" class="figcap">Figure A.1. Sequence flow for Alert.Collision.Warning. Trust verification is a chokepoint before Translation. Renderer dispatch is multicast; acknowledgement is tracked by Runtime.</text>
</svg>
